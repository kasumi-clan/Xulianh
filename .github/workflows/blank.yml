name: Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Đường dẫn ZIP (để trống = tự tìm file .zip ở gốc repo)"
        required: false
        default: ""
      run_tests:
        description: "Chạy test trước khi build"
        type: boolean
        default: false
  push:
    paths:
      - "*.zip"
      - "upload/*.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Giải nén ZIP
        id: unzip
        shell: bash
        env:
          ZIP_INPUT: ${{ github.event.inputs.zip_path }}
        run: |
          set -euo pipefail
          ZIP="${ZIP_INPUT:-}"
          if [ -z "$ZIP" ]; then
            ZIP="$(ls -1t ./*.zip upload/*.zip 2>/dev/null | sed -n '1p' || true)"
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::Không tìm thấy file ZIP (đặt .zip ở gốc repo hoặc upload/)"
            exit 1
          fi
          echo "ZIP: $ZIP ($(stat -c%s "$ZIP") byte)"
          rm -rf _proj && mkdir _proj
          unzip -q -o "$ZIP" -d _proj
          SETTINGS="$(find _proj \( -name '__MACOSX' -o -name node_modules \) -prune -o -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print \
            | awk '{ print length($0) "\t" $0 }' | sort -n | sed -n '1p' | cut -f2-)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::ZIP không chứa settings.gradle(.kts) — không phải dự án Android"
            exit 1
          fi
          ROOT="$(dirname "$SETTINGS")"
          echo "Gốc dự án: $ROOT"
          if [ -f "$ROOT/gradlew" ] && [ -f "$ROOT/gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x "$ROOT/gradlew"
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "gradle_cmd=$GRADLE_CMD" >> "$GITHUB_OUTPUT"

      - name: Chấp nhận license Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Chạy test (tùy chọn)
        if: ${{ github.event.inputs.run_tests == 'true' }}
        working-directory: ${{ steps.unzip.outputs.root }}
        shell: bash
        run: ${{ steps.unzip.outputs.gradle_cmd }} testDebugUnitTest --stacktrace --no-daemon

      - name: Build APK
        working-directory: ${{ steps.unzip.outputs.root }}
        shell: bash
        run: ${{ steps.unzip.outputs.gradle_cmd }} assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: ${{ steps.unzip.outputs.root }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload báo cáo lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: ${{ steps.unzip.outputs.root }}/**/build/reports
          if-no-files-found: ignore
